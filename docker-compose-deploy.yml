# For a remote Linux server that only ever runs the published image - no
# git clone, no Dockerfile, no Go toolchain needed there at all. Copy this
# file and a filled-in .env (see .env.example) to the server and that is
# the entire deployment artifact.
#
# This is deliberately a separate file from docker-compose.yml rather than
# the same one: docker-compose.yml also carries a `build: .` path for local
# development against the Dockerfile in this repo, which has no meaning -
# and nothing to build from - on a server that never has the source checked
# out. Keeping them apart means there is no `build:` key here to ever be
# used by mistake and quietly deploy a locally-built image instead of the
# one GitHub Actions already tested.
#
# Full step-by-step (the external `proxy` Traefik network, filling in .env,
# `docker login ghcr.io`, finding TRUSTED_PROXY_CIDRS after first start,
# first admin login): see AppLaunch.readme, or README.md's
# "Running with Docker" and "Reverse proxy" sections.
#
# Deploy / update:
#   docker compose -f docker-compose-deploy.yml pull
#   docker compose -f docker-compose-deploy.yml up -d
#   docker compose -f docker-compose-deploy.yml logs -f app
#
# Always pass -f docker-compose-deploy.yml explicitly - `docker compose` on
# its own only auto-discovers docker-compose.yml. And don't run both files
# from the same directory on the same host: Compose infers a project name
# from the directory by default, and both files define an `app` service
# under that same project, so the second `up` recreates the first one's
# container in place rather than running alongside it (verified - this is
# not a hypothetical). Harmless since both point at the same /data volume
# either way, but surprising if you're not expecting it. If you ever do
# need both on one host, give one an explicit `-p <name>`.

services:
  app:
    # Built and published by .github/workflows/docker-publish.yml on every
    # push to master in the source repo, only after go vet, staticcheck,
    # govulncheck and go test all pass there. Pin IMAGE_TAG in .env (a
    # commit's short SHA, or a vX.Y.Z release tag) for a deployment that
    # only changes when deliberately bumped; left unset, `latest` always
    # tracks the newest build on master.
    image: ghcr.io/dani5665/apl_modules:${IMAGE_TAG:-latest}
    # The image is linux/amd64 only (see the workflow); pin the platform so
    # a mismatched (e.g. ARM) host fails immediately and obviously instead
    # of silently running under emulation or failing to find a manifest.
    platform: linux/amd64
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    container_name: apl-modules

    # Hardening: the application writes nothing outside /data (the one
    # volume below) - no local temp files, nothing cached to disk elsewhere
    # - so the rest of the filesystem can be read-only. /tmp is still
    # writable in case the Go runtime itself ever wants scratch space; the
    # app does not use it. The container already runs as non-root
    # (distroless's fixed nonroot user, baked into the image) and needs no
    # Linux capability at all - it binds an unprivileged port and does
    # nothing else that caps would gate.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    volumes:
      # SQLite, its WAL files and the daily backups live here.
      - app-data:/data

    # Sized well above the application's own stated idle footprint (well
    # under 50 MB) to leave headroom for the SQLite page cache and a burst
    # of concurrent requests, while still catching a real leak instead of
    # letting it consume the whole host. Adjust if real usage says
    # otherwise - there's no load testing behind this starting point. If
    # `docker compose ps` ever shows this container restarting on its own,
    # check `docker stats` / `docker inspect --format '{{.State.OOMKilled}}'`
    # here first.
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"

    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # TLS is terminated by Traefik, running elsewhere on this host with its
    # own docker-compose.yml (not this one). No published port here on
    # purpose: Traefik reaches this container over the shared `proxy`
    # Docker network below, so the app is not reachable from the host at
    # all except through it.
    #
    # Assumes that Traefik instance already has an entrypoint named
    # `websecure` on 443 and a certresolver named `letsencrypt` configured
    # for ACME; edit both labels below if yours are named differently.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moduli.rule=Host(`apl-clm.autoplus.bg`)"
      - "traefik.http.routers.moduli.entrypoints=websecure"
      - "traefik.http.routers.moduli.tls.certresolver=letsencrypt"
      - "traefik.http.services.moduli.loadbalancer.server.port=8080"
    networks:
      - proxy

  # Traefik already sets X-Forwarded-For and X-Forwarded-Proto correctly on
  # its own - nothing to configure on that side.
  #
  # Because Traefik is itself a container, the app sees requests arriving
  # from Traefik's address *on the `proxy` Docker network*, not from
  # 127.0.0.1 - so TRUSTED_PROXY_CIDRS in .env must be that network's
  # subnet. Find it with `docker network inspect proxy` (look for "Subnet")
  # once the network exists, and put it in .env; otherwise the per-IP login
  # lockout treats every login through Traefik as coming from one address.

volumes:
  app-data:

# Created by Traefik's own docker-compose.yml, not this one; this file only
# attaches `app` to it via the labels above. Create it yourself once
# (`docker network create proxy`) if Traefik isn't already providing it.
networks:
  proxy:
    external: true
