services:
  app:
    # Built and published by .github/workflows/docker-publish.yml on every
    # push to master - this is the GitHub Actions-tested image, not a local
    # build, so production never runs anything CI hasn't already run
    # `go vet`/staticcheck/govulncheck/`go test` against. Pin IMAGE_TAG in
    # .env to an immutable tag (a commit SHA, or a `vX.Y.Z` release tag) for
    # a deployment that only changes when you deliberately bump it; the
    # default `latest` always tracks the newest build on master.
    #
    # `build:` stays here only for local development against this same
    # Dockerfile (`docker compose up -d --build`, which builds and tags
    # under the `image:` name below instead of pulling it, so it still
    # works with no registry login). A production host should never pass
    # `--build` - plain `docker compose pull && docker compose up -d` (or
    # just `up -d`, since pull_policy below already pulls on every run) is
    # what actually runs the GitHub Actions-built image.
    build: .
    image: ghcr.io/dani5665/apl_modules:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env

    # Hardening: the app writes nothing outside /data (the one volume below)
    # - no local temp files, nothing cached to disk elsewhere - so the rest
    # of the filesystem can be read-only. /tmp is still writable in case the
    # Go runtime itself ever wants scratch space; the app does not use it.
    # Verified this combination still starts and passes its own healthcheck
    # before committing it.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # The container already runs as non-root (distroless's fixed nonroot
    # user, baked into the image) and needs no capability at all - it binds
    # an unprivileged port and does nothing else that caps would gate.

    volumes:
      # SQLite, its WAL files and the daily backups live here.
      - app-data:/data

    # Sized well above the application's own stated idle footprint (well
    # under 50 MB) to leave headroom for the SQLite page cache and a burst
    # of concurrent requests, while still catching a real leak instead of
    # letting it consume the whole host. Adjust if real usage says otherwise
    # - there's no load testing behind this starting point.
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "1.0"

    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # TLS is terminated by Traefik, running elsewhere on this host with its
    # own docker-compose.yml (not part of this project). No published port
    # here on purpose: Traefik reaches this container over the shared
    # `proxy` Docker network below, so the app is not reachable from the
    # host at all except through it.
    #
    # Assumes that Traefik instance already has an entrypoint named
    # `websecure` on 443 and a certresolver named `letsencrypt` configured
    # for ACME; adjust both labels below if yours are named differently.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moduli.rule=Host(`apl-clm.autoplus.bg`)"
      - "traefik.http.routers.moduli.entrypoints=websecure"
      - "traefik.http.routers.moduli.tls.certresolver=letsencrypt"
      - "traefik.http.services.moduli.loadbalancer.server.port=8080"
    networks:
      - proxy

  # Traefik already sets X-Forwarded-For and X-Forwarded-Proto correctly on
  # its own - nothing to configure on that side.
  #
  # Because Traefik is itself a container, the app sees requests arriving
  # from Traefik's address *on the `proxy` Docker network*, not from
  # 127.0.0.1 - so TRUSTED_PROXY_CIDRS in .env must be that network's
  # subnet. Find it with `docker network inspect proxy` (look for "Subnet")
  # once the network exists, and put it in .env; otherwise the per-IP login
  # lockout treats every login through Traefik as coming from one address.

volumes:
  app-data:

# Created by Traefik's own docker-compose.yml, not this one; this project
# only attaches `app` to it via the labels above.
networks:
  proxy:
    external: true
