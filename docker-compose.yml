services:
  app:
    build: .
    image: moduli-zayavki:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      # SQLite, its WAL files and the daily backups live here.
      - app-data:/data
    ports:
      # Bound to loopback only: TLS is terminated by the reverse proxy in
      # front of this container, which is the only thing that should reach it.
      # Host port 8090 here only because 8080 is taken by another project on
      # this machine during local testing; change back to 8080:8080 (and
      # APP_BASE_URL in .env) for a normal deployment.
      - "127.0.0.1:8090:8080"
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # A reverse proxy terminates TLS and forwards to the app. Example nginx
  # server block:
  #
  #   server {
  #       listen 443 ssl http2;
  #       server_name moduli.example.com;
  #
  #       ssl_certificate     /etc/letsencrypt/live/moduli.example.com/fullchain.pem;
  #       ssl_certificate_key /etc/letsencrypt/live/moduli.example.com/privkey.pem;
  #
  #       location / {
  #           proxy_pass         http://127.0.0.1:8080;
  #           proxy_set_header   Host              $host;
  #           proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
  #           proxy_set_header   X-Forwarded-Proto $scheme;
  #           proxy_read_timeout 70s;
  #       }
  #   }
  #
  # Set TRUSTED_PROXY_CIDRS to the proxy's address range, otherwise
  # X-Forwarded-For is ignored and every client looks like the proxy.

volumes:
  app-data:
