services:
  app:
    build: .
    image: moduli-zayavki:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      # SQLite, its WAL files and the daily backups live here.
      - app-data:/data
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # TLS is terminated by Traefik, running elsewhere on this host with its
    # own docker-compose.yml (not part of this project). No `ports:` here on
    # purpose: Traefik reaches this container over the shared `proxy` Docker
    # network below, so the app is not reachable from the host at all except
    # through it.
    #
    # Assumes that Traefik instance already has an entrypoint named
    # `websecure` on 443 and a certresolver named `letsencrypt` configured
    # for ACME; adjust both labels below if yours are named differently.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.moduli.rule=Host(`clm.autoplus.bg`)"
      - "traefik.http.routers.moduli.entrypoints=websecure"
      - "traefik.http.routers.moduli.tls.certresolver=letsencrypt"
      - "traefik.http.services.moduli.loadbalancer.server.port=8080"
    networks:
      - proxy

  # Traefik already sets X-Forwarded-For and X-Forwarded-Proto correctly on
  # its own - nothing to configure on that side.
  #
  # Because Traefik is itself a container, the app sees requests arriving
  # from Traefik's address *on the `proxy` Docker network*, not from
  # 127.0.0.1 - so TRUSTED_PROXY_CIDRS in .env must be that network's
  # subnet. Find it with `docker network inspect proxy` (look for "Subnet")
  # once the network exists, and put it in .env; otherwise the per-IP login
  # lockout treats every login through Traefik as coming from one address.

volumes:
  app-data:

# Created by Traefik's own docker-compose.yml, not this one; this project
# only attaches `app` to it via the labels above.
networks:
  proxy:
    external: true
