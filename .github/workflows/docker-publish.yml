name: Build and publish Docker image

# Pushes to master and version tags publish to the GitHub Container Registry
# (ghcr.io), under this repository, using the token GitHub already provides
# to Actions - no extra secret to create or rotate. Pull requests only build
# (to catch a broken Dockerfile/build early) and never push an image.
on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

# Required to push packages to ghcr.io under GITHUB_TOKEN; contents:read is
# the default but stated explicitly since permissions is otherwise all-or-
# nothing once set.
permissions:
  contents: read
  packages: write

jobs:
  # Mirrors this project's own quality bar (see README.md "Testing and
  # quality"): go vet and staticcheck clean, govulncheck clean, tests pass.
  # The image is never published - even to a branch push - if this fails.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go build ./...
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: go test ./...

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ghcr.io requires a lowercase image name; the repository is
      # Dani5665/APL_Modules, which is not.
      - name: Compute a lowercase image name
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Only push on an actual push to master/a tag, never on a pull_request
      # (build-only there, to catch a broken Dockerfile without publishing).
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
