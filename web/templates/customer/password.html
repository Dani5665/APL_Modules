{{define "content"}}
<div class="narrow">
  <h1>Смяна на парола</h1>

  {{if .Forced}}
  <div class="alert alert-warning" role="status">
    Трябва да смените паролата си, преди да продължите.
  </div>
  {{end}}

  {{if .Error}}<div class="alert alert-error" role="alert">{{.Error}}</div>{{end}}

  <div class="card">
    <form method="post" action="/password">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">

      <div class="field">
        <label for="current_password">Текуща парола</label>
        <input type="password" id="current_password" name="current_password"
               autocomplete="current-password" required>
      </div>

      <div class="field">
        <label for="new_password">Нова парола</label>
        <input type="password" id="new_password" name="new_password"
               autocomplete="new-password" minlength="10" required>
        <p class="hint">Минимум 10 знака.</p>
      </div>

      <div class="field">
        <label for="confirm_password">Повторете новата парола</label>
        <input type="password" id="confirm_password" name="confirm_password"
               autocomplete="new-password" minlength="10" required>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Запази</button>
        {{if not .Forced}}<a class="btn" href="/">Отказ</a>{{end}}
      </div>
    </form>
  </div>
</div>
{{end}}
