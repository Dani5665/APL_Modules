{{define "layout_customer"}}<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5fa9">
  <title>{{.Title}} — Модули: заявки</title>
  <link rel="stylesheet" href="/static/app.css?v={{.AssetVersion}}">
  <link rel="icon" href="/static/favicon.svg?v={{.AssetVersion}}" type="image/svg+xml">
  <script src="/static/sidebar.js?v={{.AssetVersion}}"></script>
  <script src="/static/htmx.min.js?v={{.AssetVersion}}" defer></script>
  <script src="/static/app.js?v={{.AssetVersion}}" defer></script>
  <script src="/static/alpine.min.js?v={{.AssetVersion}}" defer></script>
</head>
{{/* Every htmx request carries the CSRF token through this header. */}}
<body hx-headers='{"X-CSRF-Token": "{{.CSRF}}"}'>
  <a class="skip-link" href="#main">Към съдържанието</a>

  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Меню">
      <a class="brand" href="/">Модули<span>:</span> заявки</a>
      <nav class="side-nav" aria-label="Основна навигация">
        <a href="/" {{if eq .ActivePage "home"}}aria-current="page"{{end}}>Клиенти</a>
        <a href="/modules" {{if eq .ActivePage "modules"}}aria-current="page"{{end}}>Активни модули</a>
      </nav>
      {{if .User}}
      <div class="sidebar-user">
        <span class="sidebar-email">{{.User.Email}}</span>
        <form method="post" action="/logout">
          <input type="hidden" name="csrf_token" value="{{.CSRF}}">
          <button type="submit" class="btn btn-small btn-block">Изход</button>
        </form>
      </div>
      {{end}}
    </aside>
    <div class="sidebar-backdrop" data-sidebar-close></div>

    <div class="app-main">
      <header class="topbar">
        <button type="button" class="menu-toggle" data-sidebar-toggle
                aria-controls="sidebar" aria-expanded="true" aria-label="Покажи или скрий менюто">
          <span class="menu-icon" aria-hidden="true"></span>
        </button>
        <span class="topbar-title">{{.Title}}</span>
      </header>

      <main id="main">
        {{template "flash" .}}
        {{template "content" .}}
      </main>
    </div>
  </div>
</body>
</html>{{end}}
