{{define "layout_customer"}}<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}} — Модули: заявки</title>
  <link rel="stylesheet" href="/static/app.css?v={{.AssetVersion}}">
  <link rel="icon" href="/static/favicon.svg?v={{.AssetVersion}}" type="image/svg+xml">
  <script src="/static/htmx.min.js?v={{.AssetVersion}}" defer></script>
  <script src="/static/app.js?v={{.AssetVersion}}" defer></script>
  <script src="/static/alpine.min.js?v={{.AssetVersion}}" defer></script>
</head>
{{/* Every htmx request carries the CSRF token through this header. */}}
<body hx-headers='{"X-CSRF-Token": "{{.CSRF}}"}'>
  <a class="skip-link" href="#main">Към съдържанието</a>

  <header class="site-header">
    <div class="bar">
      <a class="brand" href="/">Модули<span>:</span> заявки</a>
      <nav class="site-nav" aria-label="Основна навигация">
        <a href="/" {{if eq .ActivePage "home"}}aria-current="page"{{end}}>Клиенти</a>
      </nav>
      {{if .User}}
      <div class="header-user">
        <span>{{.User.Email}}</span>
        <a href="/password" class="btn btn-small">Смяна на парола</a>
        <form method="post" action="/logout" class="inline-form">
          <input type="hidden" name="csrf_token" value="{{.CSRF}}">
          <button type="submit" class="btn btn-small">Изход</button>
        </form>
      </div>
      {{end}}
    </div>
  </header>

  <main id="main">
    {{template "flash" .}}
    {{template "content" .}}
  </main>
</body>
</html>{{end}}
